<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your result · Quizly</title><link rel="stylesheet" th:href="@{/style.css}"></head><body class="app-page"><header class="topbar"><a class="brand" href="/dashboard"><span class="brand-mark">Q</span> quizly</a><div class="topbar-right"><span class="user-chip"><span class="avatar" th:text="${#strings.substring(student.name,0,1).toUpperCase()}">A</span><span th:text="${student.name}">Student</span></span></div></header><main class="result-main"><div class="result-card"><span class="result-confetti">✳</span><span class="eyebrow">QUIZ COMPLETE</span><h1 th:text="${attempt.score == attempt.total ? 'Perfect score!' : 'Nice work, ' + student.name + '!'}">Nice work!</h1><p class="muted" th:text="${quiz.title}">Quiz name</p><div class="score-circle"><div><strong th:text="${attempt.score}">2</strong><span th:text="'out of ' + ${attempt.total}">out of 3</span></div></div><p class="result-message" th:text="${attempt.score == attempt.total ? 'You got every question right. Brilliant!' : 'Every try helps something stick. Keep going!'}">Every try helps something stick.</p><a class="button button-primary" href="/dashboard">Back to my quizzes <span>→</span></a></div><p class="result-foot">Keep showing up. It adds up. <span>✳</span></p></main></body></html>
