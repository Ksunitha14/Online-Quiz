<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${quiz.title} + ' · Quizly'">Quiz · Quizly</title><link rel="stylesheet" th:href="@{/style.css}"></head><body class="app-page"><header class="topbar"><a class="brand" href="/dashboard"><span class="brand-mark">Q</span> quizly</a><div class="topbar-right"><a class="button button-quiet" href="/dashboard">← All quizzes</a><span class="user-chip"><span class="avatar" th:text="${#strings.substring(student.name,0,1).toUpperCase()}">A</span><span th:text="${student.name}">Student</span></span></div></header><main class="quiz-main"><a class="back-link" href="/dashboard">← Back to quizzes</a><div class="quiz-intro"><span class="eyebrow">A QUICK KNOWLEDGE CHECK</span><h1 th:text="${quiz.title}">Quiz title</h1><p class="muted" th:text="${quiz.description}">Description</p></div><form th:action="@{/quizzes/{id}/submit(id=${quiz.id})}" method="post"><div class="question-card" th:each="question,iter : ${quiz.questions}"><div class="question-label"><span th:text="'QUESTION ' + ${iter.count}">QUESTION 1</span><span th:text="${iter.count} + ' / ' + ${#lists.size(quiz.questions)}">1 / 3</span></div><h2 th:text="${question.prompt}">Question goes here?</h2><div class="answers"><label class="answer-option"><input type="radio" th:name="'q' + ${question.id}" value="0"><span class="answer-letter">A</span><span th:text="${question.optionA}">Option A</span></label><label class="answer-option"><input type="radio" th:name="'q' + ${question.id}" value="1"><span class="answer-letter">B</span><span th:text="${question.optionB}">Option B</span></label><label class="answer-option"><input type="radio" th:name="'q' + ${question.id}" value="2"><span class="answer-letter">C</span><span th:text="${question.optionC}">Option C</span></label><label class="answer-option"><input type="radio" th:name="'q' + ${question.id}" value="3"><span class="answer-letter">D</span><span th:text="${question.optionD}">Option D</span></label></div></div><div class="submit-row"><span>Take your time. You’ve got this.</span><button class="button button-primary" type="submit">Submit answers <span>→</span></button></div></form></main></body></html>
